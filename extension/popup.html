<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save to Google Photos</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" stroke="url(#grad)" stroke-width="2"/>
          <path d="M12 6v6l4 2" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
              <stop stop-color="#4285F4"/>
              <stop offset="0.33" stop-color="#EA4335"/>
              <stop offset="0.66" stop-color="#FBBC05"/>
              <stop offset="1" stop-color="#34A853"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>Save to Google Photos</h1>
    </div>

    <!-- Status Card -->
    <div class="status-card" id="statusCard">
      <div class="status-indicator" id="statusIndicator">
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Checking…</span>
      </div>
      <p class="status-hint" id="statusHint"></p>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="signInBtn" class="btn btn-primary" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In with Google
      </button>
      <button id="signOutBtn" class="btn btn-secondary" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign Out
      </button>
      <button id="saveAllBtn" class="btn btn-batch" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Choose images on this page
      </button>
      <button id="saveNoteBtn" class="btn btn-batch" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <path d="M8 3v18"/>
        </svg>
        Choose images in this post
      </button>
    </div>

    <!-- Recent activity -->
    <div class="history">
      <div class="history-head">
        <span>Recent</span>
        <button id="clearHistoryBtn" class="link-btn">Clear</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </div>

    <!-- Footer -->
    <div class="footer">
      Right-click any image → <strong>Save to Google Photos</strong>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
