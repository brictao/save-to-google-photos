<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save to Google Photos</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <img class="logo" src="icons/icon48.png" width="36" height="36" alt="" />
      <div class="header-copy">
        <p class="eyebrow">SAVE TO</p>
        <h1>Google Photos</h1>
      </div>
    </header>

    <section class="status-card" id="statusCard" aria-label="Google connection">
      <div class="status-row">
        <div class="status-indicator" id="statusIndicator" role="status">
          <span class="dot" id="statusDot" aria-hidden="true"></span>
          <span class="status-text" id="statusText">Checking…</span>
        </div>
        <button id="signOutBtn" class="link-btn sign-out" style="display:none;">Sign out</button>
      </div>
      <p class="status-hint" id="statusHint" aria-live="polite"></p>
    </section>

    <div class="actions">
      <button id="signInBtn" class="btn btn-primary" style="display:none;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <path d="m10 17 5-5-5-5M15 12H3"/>
        </svg>
        Sign in with Google
      </button>
      <button id="saveAllBtn" class="btn btn-primary" style="display:none;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        Choose images and videos
        <span class="action-arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <section class="album-card" id="albumCard" style="display:none;" aria-labelledby="albumHeading">
      <div class="album-head">
        <h2 id="albumHeading">Save to album</h2>
        <button id="albumUnbindBtn" class="link-btn" style="display:none;">Unbind</button>
      </div>
      <div class="album-current" id="albumCurrent" style="display:none;">
        <div class="album-destination">
          <svg class="album-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"/>
            <path d="M7 2h10M3 16l5-5 5 5 3-3 5 5"/>
            <circle cx="16" cy="10" r="1"/>
          </svg>
          <a class="album-name" id="albumLink" target="_blank" rel="noopener"></a>
          <span class="external-arrow" aria-hidden="true">↗</span>
        </div>
      </div>
      <div class="album-switch" id="albumSwitchRow" style="display:none;">
        <select id="albumSelect" class="album-select" aria-label="Choose a saved album"></select>
      </div>
      <div class="album-create" id="albumCreateRow">
        <input id="albumTitle" class="album-input" type="text" maxlength="500" autocomplete="off" placeholder="New album name" aria-label="New album name" />
        <button id="albumCreateBtn" class="btn btn-secondary">Create</button>
      </div>
      <button id="albumRestoreToggle" class="link-btn album-restore-toggle" type="button" aria-expanded="false" aria-controls="albumRestoreRow">Have an album link?</button>
      <div class="album-restore" id="albumRestoreRow" style="display:none;">
        <input id="albumRestoreInput" class="album-input" type="text" autocomplete="off" placeholder="Paste photos.google.com/album/... link" aria-label="Album link or ID" />
        <button id="albumRestoreBtn" class="btn btn-secondary" type="button">Link</button>
      </div>
      <p class="album-hint" id="albumHint" aria-live="polite">New saves will be added to this album automatically.</p>
      <button id="albumDuplicateBtn" class="link-btn album-duplicate" style="display:none;"></button>
    </section>

    <section class="history" aria-labelledby="historyHeading">
      <div class="history-head">
        <h2 id="historyHeading">Recent activity</h2>
        <button id="clearHistoryBtn" class="link-btn">Clear</button>
      </div>
      <ul id="historyList" class="history-list" aria-live="polite"></ul>
    </section>

    <footer class="footer">
      <svg aria-hidden="true" width="14" height="17" viewBox="0 0 18 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="1" width="14" height="20" rx="7"/><path d="M9 1v7M2 8h14"/></svg>
      <p>You can also right-click an image to save it.</p>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
