<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1400px;
            height: 560px;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 44px 70px;
            text-align: center;
            max-width: 1000px;
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .left {
            flex-shrink: 0;
        }

        .title {
            font-size: 40px;
            font-weight: 800;
            background: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-align: left;
        }

        .subtitle {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.5;
            text-align: left;
            max-width: 380px;
        }

        .steps {
            display: flex;
            gap: 20px;
        }

        .step {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 22px 18px;
            width: 150px;
            text-align: center;
        }

        .step-num {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4285F4, #356ac3);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }

        .step-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .step-desc {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="left">
            <div class="title">Save to<br />Google Photos</div>
            <div class="subtitle">Right-click any image on the web and save it directly to your Google Photos library
            </div>
        </div>
        <div class="steps">
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-title">Right-Click</div>
                <div class="step-desc">Right-click any image on a web page</div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-title">Save</div>
                <div class="step-desc">Select "Save to Google Photos"</div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-title">Done!</div>
                <div class="step-desc">Image appears in your Google Photos</div>
            </div>
        </div>
    </div>
</body>

</html>
